name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: pig
            archive: pig-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: pig
            archive: pig-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: pig
            archive: pig-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: pig.exe
            archive: pig-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: script/bootstrap

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: script/bootstrap

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-${{ matrix.target }}-

      - name: Set environment variables
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "PIG_VERSION=${VERSION}" >> "$GITHUB_ENV"
          else
            echo "PIG_VERSION=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build release binary
        env:
          PIG_UPDATE_URL: ${{ secrets.PIG_UPDATE_URL }}
          PIG_UPDATE_DOWNLOAD_URL: ${{ secrets.PIG_UPDATE_DOWNLOAD_URL }}
          PIG_WECHAT_QR_URL: ${{ secrets.PIG_WECHAT_QR_URL }}
          PIG_ALIPAY_QR_URL: ${{ secrets.PIG_ALIPAY_QR_URL }}
          PIG_PAYPAL_QR_URL: ${{ secrets.PIG_PAYPAL_QR_URL }}
        run: cargo build --release -p main --target ${{ matrix.target }}

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        run: |
          chmod +x script/bundle-macos.sh
          chmod +x script/bundle-macos-dmg.sh
          script/bundle-macos.sh ${{ matrix.target }}
          script/bundle-macos-dmg.sh ${{ matrix.target }}
          tar czf ${{ matrix.archive }} -C target .app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/128x128/apps
          mkdir -p package/usr/share/icons/hicolor/256x256/apps
          mkdir -p package/usr/share/icons/hicolor/512x512/apps
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/usr/bin/
          cp resources/linux/pig.desktop package/usr/share/applications/
          cp resources/linux/pig-128.png package/usr/share/icons/hicolor/128x128/apps/pig.png
          cp resources/linux/pig-256.png package/usr/share/icons/hicolor/256x256/apps/pig.png
          cp resources/linux/pig-512.png package/usr/share/icons/hicolor/512x512/apps/pig.png
          tar czf ${{ matrix.archive }} -C package .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload macOS DMG artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pig-${{ matrix.target }}.dmg
          path: pig-${{ matrix.target }}.dmg

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum pig-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pig ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/pig-*.tar.gz
            artifacts/pig-*.zip
            artifacts/pig-*.dmg
            artifacts/sha256sums.txt
